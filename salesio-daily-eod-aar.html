<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily EOD / AAR</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;color:#f0ece4;font-family:'Inter',sans-serif;font-size:13px;line-height:1.4;}

.wrap{max-width:1000px;margin:0 auto;padding:36px 32px 56px;}
h1{font-size:22px;font-weight:900;letter-spacing:-.5px;margin-bottom:4px;}
.sub{font-size:12px;color:#777;margin-bottom:28px;}

.form-block{border:1px solid #1e1e1e;border-radius:10px;padding:18px 20px;margin-bottom:16px;}
.form-title{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#4ade80;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #1e1e1e;}

.field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px;}
.field{border:1px solid #1e1e1e;border-radius:6px;padding:6px 9px;}
.field label{display:block;font-size:9.5px;color:#777;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px;}
.field .fill{height:14px;}

.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.qa{border:1px solid #1e1e1e;border-radius:6px;padding:7px 10px;}
.qa label{display:block;font-size:9.5px;color:#777;margin-bottom:3px;}
.qa .fill{height:34px;}

@media(max-width:640px){
  .qa-grid{grid-template-columns:1fr;}
}

.footer{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#333;margin-top:20px;text-align:center;}

@media print{
  body{background:#fff;color:#000;}
  .form-block{border-color:#ccc;}
  .field, .qa{border-color:#ccc;}
  .form-title{color:#000;}
  .field label, .qa label, .sub, .footer{color:#666;}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Daily EOD / AAR</h1>
  <div class="sub">Sales.io &middot; submit end of every workday &middot; fill in your role's form below</div>

  <div class="form-block">
    <div class="form-title">Coaching EOD &mdash; JJ / Cole</div>
    <div class="field-grid">
      <div class="field"><label>Date</label><div class="fill"></div></div>
      <div class="field"><label>Calls Booked</label><div class="fill"></div></div>
      <div class="field"><label>No Shows</label><div class="fill"></div></div>
      <div class="field"><label>Rescheduled</label><div class="fill"></div></div>
      <div class="field"><label>Refunded</label><div class="fill"></div></div>
      <div class="field"><label>Cancelled</label><div class="fill"></div></div>
      <div class="field"><label>Double Booked</label><div class="fill"></div></div>
      <div class="field"><label>Calls Taken</label><div class="fill"></div></div>
      <div class="field"><label>Close Rate</label><div class="fill"></div></div>
      <div class="field"><label>Performance (1&ndash;10)</label><div class="fill"></div></div>
      <div class="field"><label>Mindset (1&ndash;10)</label><div class="fill"></div></div>
    </div>
    <div class="qa-grid">
      <div class="qa"><label>What went well?</label><div class="fill"></div></div>
      <div class="qa"><label>What can be better?</label><div class="fill"></div></div>
    </div>
  </div>

  <div class="form-block">
    <div class="form-title">Setter AAR &mdash; Jalen / Faris</div>
    <div class="field-grid">
      <div class="field"><label>Name</label><div class="fill"></div></div>
      <div class="field"><label>Date</label><div class="fill"></div></div>
      <div class="field"><label>Contacts Reached</label><div class="fill"></div></div>
      <div class="field"><label>New Leads In</label><div class="fill"></div></div>
      <div class="field"><label>Closes</label><div class="fill"></div></div>
      <div class="field"><label>Cash Collected</label><div class="fill"></div></div>
      <div class="field"><label>WTD CC</label><div class="fill"></div></div>
      <div class="field"><label>MTD CC</label><div class="fill"></div></div>
      <div class="field"><label>Posted in Team Channel?</label><div class="fill"></div></div>
    </div>
    <div class="qa-grid">
      <div class="qa"><label>What went well today?</label><div class="fill"></div></div>
      <div class="qa"><label>What could have gone better?</label><div class="fill"></div></div>
      <div class="qa" style="grid-column:1/-1;"><label>Need help from JJ or Cole?</label><div class="fill"></div></div>
    </div>
  </div>

  <div class="form-block">
    <div class="form-title">Closer AAR &mdash; Lu</div>
    <div class="field-grid">
      <div class="field"><label>Name</label><div class="fill"></div></div>
      <div class="field"><label>Date</label><div class="fill"></div></div>
      <div class="field"><label>Calls on Calendar</label><div class="fill"></div></div>
      <div class="field"><label>Shows</label><div class="fill"></div></div>
      <div class="field"><label>Offers Made</label><div class="fill"></div></div>
      <div class="field"><label>No Shows</label><div class="fill"></div></div>
      <div class="field"><label>Reschedules</label><div class="fill"></div></div>
      <div class="field"><label>Same-Day Closes</label><div class="fill"></div></div>
      <div class="field"><label>Total Closes</label><div class="fill"></div></div>
      <div class="field"><label>Cash Collected</label><div class="fill"></div></div>
      <div class="field"><label>WTD CC</label><div class="fill"></div></div>
      <div class="field"><label>MTD CC</label><div class="fill"></div></div>
      <div class="field"><label>Posted in Team Channel?</label><div class="fill"></div></div>
    </div>
    <div class="qa-grid">
      <div class="qa"><label>What went well today?</label><div class="fill"></div></div>
      <div class="qa"><label>What could have gone better?</label><div class="fill"></div></div>
      <div class="qa" style="grid-column:1/-1;"><label>Need help from JJ or Cole?</label><div class="fill"></div></div>
    </div>
  </div>

  <div class="footer">Sales.io &middot; compiled Aug 2026</div>
</div>
</body>
</html>
